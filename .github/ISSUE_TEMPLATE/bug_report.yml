name: Bug report
description: Report a reproducible pipeline defect without sharing secrets or restricted data.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include stage, command, commit, and scrubbed error output.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [Static B, UAV BU, Adapter contract, AdvTabDDPM orchestration, Documentation]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private infrastructure, restricted data, and scene/model assets.
          required: true
