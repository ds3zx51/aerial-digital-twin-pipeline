[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-digital-twin-pipeline"
version = "0.2.0"
description = "Reproducibility-first AODT backend evaluation workflow"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "Pillow>=10"]
aerpaw = ["scipy>=1.11", "pyproj>=3.6"]
dev = []

[tool.setuptools]
py-modules = []
